name: Generate PDFs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'generate_pdf.py'
  workflow_dispatch:
    inputs:
      page:
        description: 'Path to a single .md file (e.g. docs/product/analytics/03-core-capabilities.md). Leave blank to regenerate all product PDFs.'
        required: false
        type: string
      nofront:
        description: 'Omit the branded cover page from the generated PDF.'
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt
          npm install -g @mermaid-js/mermaid-cli@11.4.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Single-page mode ────────────────────────────────────────────────────
      - name: Validate page input
        if: github.event_name == 'workflow_dispatch' && inputs.page != ''
        env:
          PAGE_INPUT: ${{ inputs.page }}
        run: |
          if [[ "$PAGE_INPUT" != *.md ]]; then
            echo "Error: page input must end in .md — got: $PAGE_INPUT"
            exit 1
          fi

      - name: Generate single-page PDF
        id: gen_page
        if: github.event_name == 'workflow_dispatch' && inputs.page != ''
        env:
          PAGE_INPUT: ${{ inputs.page }}
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py --page "$PAGE_INPUT" $NOFRONT_FLAG

      - name: Commit single-page PDF
        if: github.event_name == 'workflow_dispatch' && inputs.page != ''
        env:
          PDF_PATH: ${{ steps.gen_page.outputs.pdf_path }}
        run: |
          git add "$PDF_PATH"
          git diff --cached --quiet || git commit -m "docs: regenerate PDF for ${PDF_PATH} [skip ci]"

      # ── Full regeneration mode ───────────────────────────────────────────────
      - name: Generate and commit analytics PDF
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.page == '')
        env:
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py analytics $NOFRONT_FLAG
          git add docs/product/analytics/analytics_product_design.pdf
          git diff --cached --quiet || git commit -m "docs(analytics): regenerate PDF [skip ci]"

      - name: Generate and commit assistant PDF
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.page == '')
        env:
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py assistant $NOFRONT_FLAG
          git add docs/product/assistant/assistant_product_design.pdf
          git diff --cached --quiet || git commit -m "docs(assistant): regenerate PDF [skip ci]"

      - name: Push
        run: git push
