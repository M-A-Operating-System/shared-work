name: Generate Product PDFs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/product/**'
      - 'docs/data-models/**'
      - 'generate_pdf.py'
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to generate (analytics, assistant, knowledge, internet). Leave blank to regenerate all products.'
        required: false
        type: choice
        options:
          - ''
          - analytics
          - assistant
          - knowledge
          - internet
        default: ''
      document:
        description: 'Single Markdown document to generate, relative to the repository root (docs/product/... or docs/data-models/).'
        required: false
        type: string
        default: ''
      pages:
        description: 'Space-separated chapter prefixes for a subset PDF, e.g. "02 04 08". Requires a product selection above. Leave blank for the full product.'
        required: false
        type: string
        default: ''
      out:
        description: 'Output filename for a pages-subset PDF (e.g. subset.pdf). Only used when pages are specified.'
        required: false
        type: string
        default: ''
      nofront:
        description: 'Omit the branded cover page from the generated PDF.'
        required: false
        type: boolean
        default: false

# Serialize all runs that commit PDFs back to master.
# cancel-in-progress: false means concurrent runs queue rather than cancel —
# every triggered run completes and its PDF is committed.
concurrency:
  group: pdf-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-pango-${{ runner.os }}-${{ hashFiles('.github/workflows/generate-pdf.yml') }}

      - name: Install apt dependencies
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Restore apt packages from cache
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: sudo dpkg -i /var/cache/apt/archives/*.deb 2>/dev/null || true

      - name: Cache npm global (mermaid-cli) and Chromium
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm-global
            ~/.cache/puppeteer
          key: npm-mmdc-11.4.2-chrome-131.0.6778.204-${{ runner.os }}

      - name: Configure npm global prefix
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Install mermaid-cli
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: |
          npm install -g @mermaid-js/mermaid-cli@11.4.2
          # Download the Chromium binary that mermaid-cli/puppeteer requires.
          # puppeteer-core does not auto-download Chrome on npm install, so we
          # fetch it explicitly here so it is captured in the cache above.
          # Version is pinned to match what mermaid-cli@11.4.2 / puppeteer-core expects.
          npx @puppeteer/browsers install chrome-headless-shell@131.0.6778.204

      - name: Install pip dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Input validation ─────────────────────────────────────────────────────
      - name: Validate inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_PAGES: ${{ inputs.pages }}
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_OUT: ${{ inputs.out }}
          INPUT_DOCUMENT: ${{ inputs.document }}
        run: |
          if [ -n "$INPUT_DOCUMENT" ] && { [ -n "$INPUT_PRODUCT" ] || [ -n "$INPUT_PAGES" ] || [ -n "$INPUT_OUT" ]; }; then
            echo "Error: 'document' cannot be combined with product, pages, or out."
            exit 1
          fi
          if [ -n "$INPUT_DOCUMENT" ]; then
            case "$INPUT_DOCUMENT" in
              docs/product/*.md|docs/data-models/*) ;;
              *) echo "Error: 'document' must be a Markdown file under docs/product/ or docs/data-models/."; exit 1 ;;
            esac
          fi
          # pages requires a product
          if [ -n "$INPUT_PAGES" ] && [ -z "$INPUT_PRODUCT" ]; then
            echo "Error: 'pages' requires a product to be selected."
            exit 1
          fi
          if [ -n "$INPUT_OUT" ] && [ -z "$INPUT_PAGES" ]; then
            echo "Error: 'out' is only valid when 'pages' is also specified."
            exit 1
          fi
          if [ -n "$INPUT_PAGES" ]; then
            for prefix in $INPUT_PAGES; do
              if ! echo "$prefix" | grep -qE '^[0-9]{2}$'; then
                echo "Error: page prefix '$prefix' is not a two-digit number."
                exit 1
              fi
            done
          fi

      # ── Single-document mode (product or data-model document) ───────────────
      - name: Generate single document
        if: github.event_name == 'workflow_dispatch' && inputs.document != ''
        env:
          INPUT_DOCUMENT: ${{ inputs.document }}
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py --page "$INPUT_DOCUMENT" ${NOFRONT_FLAG:+'--nofront'}
          git add -- "${INPUT_DOCUMENT%.md}.pdf"
          git diff --cached --quiet || git commit -m "docs: generate ${INPUT_DOCUMENT%.md}.pdf [skip ci]"

      # ── Pages-subset mode (product + pages specified) ────────────────────────
      - name: Generate pages-subset PDF
        if: github.event_name == 'workflow_dispatch' && inputs.pages != ''
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_PAGES: ${{ inputs.pages }}
          INPUT_OUT: ${{ inputs.out }}
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          OUT_FLAG=""
          [ -n "$INPUT_OUT" ] && OUT_FLAG="--out $INPUT_OUT"
          python generate_pdf.py --product "$INPUT_PRODUCT" --pages $INPUT_PAGES $OUT_FLAG ${NOFRONT_FLAG:+"$NOFRONT_FLAG"}

      - name: Commit pages-subset PDF
        if: github.event_name == 'workflow_dispatch' && inputs.pages != ''
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
        run: |
          git add "docs/product/$INPUT_PRODUCT/"*.pdf
          git diff --cached --quiet || git commit -m "docs($INPUT_PRODUCT): generate pages-subset PDF [skip ci]"

      # ── Single-product full mode (product selected, no pages) ────────────────
      - name: Generate single-product PDF
        if: github.event_name == 'workflow_dispatch' && inputs.product != '' && inputs.pages == ''
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py --product "$INPUT_PRODUCT" ${NOFRONT_FLAG:+"$NOFRONT_FLAG"}
          git add "docs/product/$INPUT_PRODUCT/${INPUT_PRODUCT}_product_design.pdf"
          git diff --cached --quiet || git commit -m "docs($INPUT_PRODUCT): regenerate PDF [skip ci]"

      # ── All-products mode (push trigger, or dispatch with no product/pages) ───
      - name: Generate changed documents
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          declare -A products=()
          data_models=()
          generate_all=false

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed_paths=$(git ls-tree -r --name-only "$SHA")
          else
            changed_paths=$(git diff --name-only "$BEFORE" "$SHA")
          fi

          while IFS= read -r path; do
            case "$path" in
              generate_pdf.py)
                generate_all=true
                ;;
              docs/product/about.md)
                generate_all=true
                ;;
              docs/product/analytics/*.md|docs/product/assistant/*.md|docs/product/knowledge/*.md|docs/product/internet/*.md)
                product="${path#docs/product/}"
                product="${product%%/*}"
                products["$product"]=1
                ;;
              docs/data-models/*)
                data_models+=("$path")
                ;;
            esac
          done <<< "$changed_paths"

          if [ "$generate_all" = true ]; then
            for product in analytics assistant knowledge internet; do
              python generate_pdf.py --product "$product"
              git add -- "docs/product/$product/${product}_product_design.pdf"
            done
            while IFS= read -r -d '' path; do
              python generate_pdf.py --page "$path"
              git add -- "${path%.md}.pdf"
            done < <(find docs/data-models -type f -name '*.md' -print0)
          else
            for product in "${!products[@]}"; do
              python generate_pdf.py --product "$product"
              git add -- "docs/product/$product/${product}_product_design.pdf"
            done
            for path in "${data_models[@]}"; do
              if [ -f "$path" ]; then
                python generate_pdf.py --page "$path"
                git add -- "${path%.md}.pdf"
              else
                git rm -f --ignore-unmatch -- "${path%.md}.pdf"
              fi
            done
          fi

          git diff --cached --quiet || git commit -m "docs: regenerate changed PDFs [skip ci]"

      - name: Generate all PDFs
        if: github.event_name == 'workflow_dispatch' && inputs.document == '' && inputs.product == '' && inputs.pages == ''
        env:
          NOFRONT: ${{ inputs.nofront }}
        run: |
          NOFRONT_FLAG=""
          [ "$NOFRONT" = "true" ] && NOFRONT_FLAG="--nofront"
          python generate_pdf.py ${NOFRONT_FLAG:+"$NOFRONT_FLAG"}
          while IFS= read -r -d '' path; do
            python generate_pdf.py --page "$path" ${NOFRONT_FLAG:+"$NOFRONT_FLAG"}
          done < <(find docs/data-models -type f -name '*.md' -print0)
          git add docs/product/analytics/analytics_product_design.pdf
          git add docs/product/assistant/assistant_product_design.pdf
          git add docs/product/knowledge/knowledge_product_design.pdf
          git add docs/product/internet/internet_product_design.pdf
          while IFS= read -r -d '' pdf; do
            git add -- "$pdf"
          done < <(find docs/data-models -type f -name '*.pdf' -print0)
          git diff --cached --quiet || git commit -m "docs: regenerate all product PDFs [skip ci]"

      - name: Push
        # Pull --rebase before pushing so that if a queued run is behind the
        # run that just finished (and committed a PDF), this run incorporates
        # that commit rather than failing with a non-fast-forward error.
        # -X theirs: when two queued runs both committed PDFs and rebase hits a
        # binary conflict, prefer this run's freshly-generated file over the
        # version already in master ("theirs" = the commit being replayed).
        run: |
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
