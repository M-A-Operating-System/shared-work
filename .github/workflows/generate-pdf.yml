name: Generate PDFs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'generate_pdf.py'
  workflow_dispatch:
    inputs:
      page:
        description: 'Path to a single .md file (e.g. docs/product/analytics/03-core-capabilities.md). Leave blank to regenerate all product PDFs.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Single-page mode ────────────────────────────────────────────────────
      - name: Generate single-page PDF
        if: github.event_name == 'workflow_dispatch' && inputs.page != ''
        run: |
          python generate_pdf.py --page "${{ inputs.page }}"
          PDF="${{ inputs.page }}"
          PDF="${PDF%.md}.pdf"
          git add "$PDF"
          git diff --cached --quiet || git commit -m "docs: regenerate PDF for ${{ inputs.page }} [skip ci]"

      # ── Full regeneration mode ───────────────────────────────────────────────
      - name: Generate and commit analytics PDF
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.page == '')
        run: |
          python generate_pdf.py analytics
          git add docs/product/analytics/analytics_product_design.pdf
          git diff --cached --quiet || git commit -m "docs(analytics): regenerate PDF [skip ci]"

      - name: Generate and commit assistant PDF
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.page == '')
        run: |
          python generate_pdf.py assistant
          git add docs/product/assistant/assistant_product_design.pdf
          git diff --cached --quiet || git commit -m "docs(assistant): regenerate PDF [skip ci]"

      - name: Push
        run: git push
